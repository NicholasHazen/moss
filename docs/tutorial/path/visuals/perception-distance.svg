<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
<title id="title">Perception uses cardinal distance rather than straight-line distance</title>
<desc id="desc">Future food-choice example. Fern stands at cell 6 comma 6 with Manhattan radius four. Shaded cells require at most four cardinal steps. Patch 9 at 10 comma 6 is exactly four steps away and qualifies. Patch 8 at 9 comma 8 needs three horizontal and two vertical steps, so it does not qualify despite looking closer along a straight line. Both contain eighty biomass. The markers are labels, not physical footprints.</desc>
