<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" role="img" aria-labelledby="title desc">
<title id="title">The proposed complete tick after future lesson activation</title>
<desc id="desc">Environment and growth run first, followed by maintenance, choice, movement, meals, and a proposed starvation check after allowed feeding. The tick then completes and inspection reads the result. Later phases are not running today. Camera and rendering are observers and do not decide biological changes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496c54"/></marker></defs>
<rect width="820" height="600" rx="14" fill="#f6f7f1"/>
<g font-family="system-ui, sans-serif" fill="#20382c">
<text x="28" y="40" font-size="25" font-weight="700">Order decides which result the next rule sees</text>
<text x="28" y="72" font-size="17">Proposed after future activation · today's schedule is still smaller</text>
<g fill="#fff" stroke="#b9cbb8"><rect x="30" y="100" width="320" height="48" rx="8"/><rect x="30" y="164" width="320" height="48" rx="8"/><rect x="30" y="228" width="320" height="48" rx="8"/><rect x="30" y="292" width="320" height="48" rx="8"/><rect x="30" y="356" width="320" height="48" rx="8"/><rect x="30" y="420" width="320" height="48" rx="8"/><rect x="30" y="484" width="320" height="48" rx="8"/></g>
<g fill="none" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"><path d="M190 151V161"/><path d="M190 215V225"/><path d="M190 279V289"/><path d="M190 343V353"/><path d="M190 407V417"/><path d="M190 471V481"/></g>
<g font-size="18" font-weight="650"><text x="48" y="131">Environment + growth</text><text x="48" y="195">Maintenance</text><text x="48" y="259">Choose or continue seeking</text><text x="48" y="323">Accepted movement</text><text x="48" y="387">Finite meals</text><text x="48" y="451">Proposed starvation check</text><text x="48" y="515">Complete tick + observe</text></g>
<g font-size="17"><text x="378" y="129">New food can be available this tick.</text><text x="378" y="193">Deduct upkeep, bounded by reserve.</text><text x="378" y="257">Decide from the remaining reserve.</text><text x="378" y="321">Pay only for actual cells traveled.</text><text x="378" y="385">Each eater sees the real remainder.</text><text x="378" y="449">Test zero after allowed feeding.</text><text x="378" y="513">Count and inspect committed outcomes.</text></g>
<text x="28" y="575" font-size="17">Camera and frame rate observe this process; they do not supply its time or rules.</text>
</g></svg>
