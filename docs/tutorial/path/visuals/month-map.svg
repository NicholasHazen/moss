<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" role="img" aria-labelledby="title desc">
<title id="title">Four learning arcs after today's movement session</title>
<desc id="desc">Sessions one to four add finite meals and autonomous choice. Five to eight add populations and individual maintenance costs. Nine to twelve add growth and tick-owned daylight. Thirteen to sixteen propose starvation, record bounded outcomes and investigate scarcity. This is a proposed route. Each arc reuses earlier concepts; observations and learning needs can change what comes next.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496c54"/></marker></defs>
<rect width="860" height="620" rx="14" fill="#f6f7f1"/>
<g font-family="system-ui, sans-serif" fill="#20382c">
<text x="30" y="40" font-size="25" font-weight="700">A world that grows with your understanding</text>
<text x="30" y="72" font-size="17">After today's reviewed movement · a proposed route that can adapt</text>
<text x="50" y="111" font-size="15" font-weight="650">VISIBLE RESULT</text>
<text x="465" y="111" font-size="15" font-weight="650">IDEAS YOU RETURN TO</text>
<rect x="30" y="125" width="800" height="90" rx="10" fill="#e3eddf" stroke="#b9cbb8"/>
<text x="50" y="155" font-size="20" font-weight="700">01–04 · Fern finds a finite meal</text>
<text x="50" y="185" font-size="17">Eat → share → choose → keep seeking</text>
<text x="465" y="157" font-size="17">Borrowing, bounded changes,</text>
<text x="465" y="184" font-size="17">Option, state and execution order</text>
<path d="M230 220V237" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="245" width="800" height="90" rx="10" fill="#fff" stroke="#b9cbb8"/>
<text x="50" y="275" font-size="20" font-weight="700">05–08 · Compare individuals</text>
<text x="50" y="305" font-size="17">Population → owned costs → experiment</text>
<text x="465" y="277" font-size="17">Identity, shared defaults, components,</text>
<text x="465" y="304" font-size="17">queries and controlled comparisons</text>
<path d="M230 340V357" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="365" width="800" height="90" rx="10" fill="#e3eddf" stroke="#b9cbb8"/>
<text x="50" y="395" font-size="20" font-weight="700">09–12 · Give food a source</text>
<text x="50" y="425" font-size="17">Grow → share new food → day → night</text>
<text x="465" y="397" font-size="17">Capacity limits, composition,</text>
<text x="465" y="424" font-size="17">executed ticks and boundary tests</text>
<path d="M230 460V477" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="485" width="800" height="90" rx="10" fill="#fff" stroke="#b9cbb8"/>
<text x="50" y="515" font-size="20" font-weight="700">13–16 · Explain scarcity</text>
<text x="50" y="545" font-size="17">Choose a boundary → record → compare</text>
<text x="465" y="517" font-size="17">Lifecycle, stable IDs, finite history,</text>
<text x="465" y="544" font-size="17">accounting and repeatable evidence</text>
<text x="30" y="604" font-size="16">Observe the world, review the learning, then recommend one next edit.</text>
</g></svg>
