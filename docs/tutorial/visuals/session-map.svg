<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Today's path from authored intent to visible movement</title>
<desc id="desc">The fixture gives Fern Meadow's stable ID. Nick implements one affordable step in an ordinary Rust helper and checks its test. After review, the agent activates the ECS adapter. The simulation updates Position and Energy; the browser reads Position to draw Fern. A finite meal is the optional next checkpoint.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#436552"/></marker></defs>
<rect width="760" height="620" rx="14" fill="#f6f7f1"/>
<g font-family="system-ui, sans-serif" fill="#20382c">
<text x="30" y="42" font-size="25" font-weight="700">One journey, one rule to write</text>
<text x="30" y="71" font-size="17">Prepared now → your edit → review → visible result</text>
<rect x="30" y="94" width="700" height="75" rx="10" fill="#e4eadd" stroke="#b9cbb8"/>
<text x="50" y="123" font-size="19" font-weight="650">1 · The fixture supplies intent</text>
<text x="50" y="150" font-size="17">Fern #1 → FoodTarget(#3) → Meadow. Choice comes later.</text>
<path d="M380 173V197" stroke="#436552" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="205" width="700" height="97" rx="10" fill="#fff" stroke="#477d59" stroke-width="2"/>
<text x="50" y="236" font-size="20" font-weight="700">2 · Your edit: move_one_cell</text>
<text x="50" y="263" font-size="17">Propose a cell · check bounds and cost · commit both values</text>
<text x="50" y="288" font-size="16" fill="#506451">Ordinary Rust values first. One focused test: red → green.</text>
<path d="M380 306V330" stroke="#436552" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="338" width="700" height="85" rx="10" fill="#e4eadd" stroke="#b9cbb8"/>
<text x="50" y="369" font-size="19" font-weight="650">3 · After review, the agent activates the adapter</text>
<text x="50" y="399" font-size="17">Each tick: maintenance → movement → complete tick</text>
<path d="M380 427V451" stroke="#436552" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="459" width="330" height="87" rx="10" fill="#fff" stroke="#b9cbb8"/>
<text x="50" y="490" font-size="19" font-weight="650">Simulation: one ECS world</text>
<text x="50" y="519" font-size="17">Position + Energy change</text>
<path d="M366 502H394" stroke="#436552" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="402" y="459" width="328" height="87" rx="10" fill="#fff" stroke="#b9cbb8"/>
<text x="422" y="490" font-size="19" font-weight="650">Browser: read the result</text>
<text x="422" y="519" font-size="17">Transform draws Fern's cell</text>
<text x="30" y="587" font-size="17">Core finish: reach Meadow. Optional stretch: transfer a finite meal.</text>
</g></svg>
