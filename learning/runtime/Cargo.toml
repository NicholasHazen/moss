[package]
name = "moss-fieldnotes-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy_ecs = { version = "=0.18.1", default-features = false, features = ["std"] }
moss-sim = { path = "../../crates/moss-sim" }

[profile.release]
opt-level = "s"
lto = "thin"
