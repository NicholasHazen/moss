<g stroke="#709161" stroke-width="1.3" opacity=".4"><path d="M820 367V323m0 32l-13-13m13 5l14-16M138 280v-34m0 19l-11-12m11 6l13-14M864 166v-37m0 20l-12-14m12 8l14-15"/></g>
