<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title description">
<title id="title">Nine steps to Meadow</title>
<desc id="description">An illustrated proposed journey, not a runtime screenshot. Fern the hare at 10,10 travels six cells east and three north to Meadow the grass patch at 16,13. The route changes x before y.</desc>
