</g>
<g fill="#eef1e4" stroke="#356647" stroke-width="2">
<circle cx="314" cy="330" r="5"/><circle cx="368" cy="330" r="5"/><circle cx="422" cy="330" r="5"/><circle cx="476" cy="330" r="5"/><circle cx="530" cy="330" r="5"/><circle cx="584" cy="330" r="5"/><circle cx="584" cy="276" r="5"/><circle cx="584" cy="222" r="5"/>
</g>
<g transform="translate(250 317)" fill="#56694a" stroke="#354c37" stroke-width="2"><ellipse cx="0" cy="0" rx="18" ry="13"/><circle cx="17" cy="-13" r="10"/><ellipse cx="12" cy="-31" rx="4" ry="13" transform="rotate(-12 12 -31)"/><ellipse cx="23" cy="-29" rx="4" ry="13" transform="rotate(14 23 -29)"/><circle cx="21" cy="-15" r="1.5" fill="#f9faf3" stroke="none"/><circle cx="-20" cy="-3" r="6" fill="#eff1df"/></g>
<g transform="translate(584 149)"><ellipse cy="9" rx="32" ry="12" fill="#9bae78"/><g fill="none" stroke="#486b3e" stroke-width="4" stroke-linecap="round"><path d="M-13 11q-6-22-15-25M-8 8q-1-30 8-40M4 9q10-29 19-32M15 9q15-12 23-14M0 10q-5-21-13-23"/></g></g>
