<text x="230" y="385" font-size="26" font-family="Georgia, serif">Fern</text><text x="230" y="410" font-size="16">Hare · (10, 10)</text>
<text x="642" y="131" font-size="26" font-family="Georgia, serif">Meadow</text><text x="642" y="157" font-size="16">Grass patch · (16, 13)</text>
<text x="360" y="302" font-size="17">6 cells east</text><text x="613" y="264" font-size="17">3 cells north</text>
