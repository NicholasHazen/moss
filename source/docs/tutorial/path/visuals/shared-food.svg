<svg xmlns="http://www.w3.org/2000/svg" width="900" height="516" viewBox="0 0 900 516" role="img" aria-labelledby="title desc">
<title id="title">A copied food observation is not an award</title>
<desc id="desc">Future shared-meal example with two empty hares and five biomass. The correct sequential resolver gives ID 1 four units, updates the patch to one, then gives ID 7 one unit and leaves zero. A rejected resolver calculates both awards from the original five, giving four each. Clamping the final patch to zero does not undo the three invented energy units. Both approaches can run sequentially with valid Rust borrows.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#53655b" stroke-width="1.5"/></marker>
</defs>
<rect width="900" height="516" rx="14" fill="#f6f7f1"/>
<g font-family="system-ui, sans-serif" fill="#20382c">
  <text x="28" y="39" font-size="25" font-weight="700">One patch, two requests</text>
  <text x="28" y="70" font-size="17">Future meal resolution · both hares start empty · each can take up to 4</text>

  <rect x="24" y="93" width="852" height="158" rx="10" fill="#e4efdf" stroke="#b4cbae"/>
  <text x="44" y="123" font-size="20" font-weight="700">Read the current patch for each transfer</text>
  <rect x="44" y="142" width="139" height="57" rx="7" fill="#fff"/>
  <text x="113" y="177" text-anchor="middle" font-size="21">Biomass 5</text>
  <path d="M193 170H315" stroke="#53655b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="256" y="156" text-anchor="middle" font-size="16">ID 1 takes 4</text>
  <rect x="326" y="142" width="139" height="57" rx="7" fill="#fff"/>
  <text x="395" y="177" text-anchor="middle" font-size="21">Biomass 1</text>
  <path d="M475 170H597" stroke="#53655b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="538" y="156" text-anchor="middle" font-size="16">ID 7 takes 1</text>
  <rect x="608" y="142" width="139" height="57" rx="7" fill="#fff"/>
  <text x="677" y="177" text-anchor="middle" font-size="21">Biomass 0</text>
  <text x="44" y="230" font-size="18">Awarded 4 + 1 = 5. The second call sees the first call's change.</text>

  <rect x="24" y="268" width="852" height="168" rx="10" fill="#f5e8dc" stroke="#d8bca2"/>
  <text x="44" y="299" font-size="20" font-weight="700">Rejected: calculate both awards from the old observation</text>
  <rect x="44" y="316" width="193" height="57" rx="7" fill="#fff"/>
  <text x="140" y="351" text-anchor="middle" font-size="19">Copied biomass 5</text>
  <path d="M247 344H338" stroke="#53655b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="349" y="316" width="219" height="57" rx="7" fill="#fff"/>
  <text x="458" y="351" text-anchor="middle" font-size="19">ID 1: +4 · ID 7: +4</text>
  <path d="M578 344H669" stroke="#53655b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="680" y="316" width="176" height="57" rx="7" fill="#fff"/>
  <text x="768" y="351" text-anchor="middle" font-size="18">Clamp patch to 0</text>
  <text x="44" y="406" font-size="18">Awarded 8 from a supply of 5. Zero remaining does not prove correct accounting.</text>

  <text x="28" y="472" font-size="17">Both can run sequentially with valid borrows. Rust does not choose the transfer rule.</text>
  <text x="28" y="497" font-size="17">Stable ordering chooses priority; the current shared state limits the actual award.</text>
</g>
</svg>
