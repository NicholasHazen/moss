<svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" role="img" aria-labelledby="title desc">
<title id="title">The same reserve can mean stay idle or keep seeking</title>
<desc id="desc">After maintenance, an idle animal starts seeking below forty-five energy. A seeking animal stops at seventy-five or above. At sixty, idle stays idle and seeking stays seeking. The gap is deliberate memory, while food availability still determines whether a valid target exists.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496c54"/></marker></defs>
<rect width="820" height="370" rx="14" fill="#f6f7f1"/>
<g font-family="system-ui, sans-serif" fill="#20382c">
<text x="28" y="40" font-size="25" font-weight="700">A small memory prevents constant switching</text>
<text x="28" y="72" font-size="17">Future rule · use reserve after maintenance</text>
<rect x="40" y="145" width="210" height="75" rx="12" fill="#fff" stroke="#477d59" stroke-width="2"/>
<text x="145" y="190" font-size="23" text-anchor="middle" font-weight="650">Idle</text>
<rect x="570" y="145" width="210" height="75" rx="12" fill="#e3eddf" stroke="#477d59" stroke-width="2"/>
<text x="675" y="190" font-size="23" text-anchor="middle" font-weight="650">Seeking</text>
<path d="M145 140V112H675V140" fill="none" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="313" y="98" width="194" height="26" fill="#f6f7f1"/>
<text x="410" y="117" text-anchor="middle" font-size="18">reserve &lt; 45</text>
<path d="M675 226V263H145V226" fill="none" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="308" y="250" width="204" height="26" fill="#f6f7f1"/>
<text x="410" y="269" text-anchor="middle" font-size="18">reserve ≥ 75</text>
<text x="277" y="172" font-size="17">At reserve 60:</text>
<text x="277" y="198" font-size="17">keep the previous state.</text>
<text x="28" y="314" font-size="17">Seeking is intent. A valid, nonempty target is still required to move or eat.</text>
<text x="28" y="344" font-size="17">No food found? Keep the state decision separate from the absent target.</text>
</g></svg>
