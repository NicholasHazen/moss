<svg xmlns="http://www.w3.org/2000/svg" width="820" height="688" viewBox="0 0 820 688" role="img" aria-labelledby="title desc">
<title id="title">Choice reads energy before the meal changes it</title>
<desc id="desc">Proposed two-tick trace, not a live browser observation. A seeking hare starts on a grass patch at reserve 74 with capacity 100 and biomass 8. Upkeep costs one. On the first tick, choice sees reserve 73 and keeps Seeking with a target. A four-unit meal leaves reserve 77 and biomass 4. On the next tick, choice sees reserve 76, changes to Idle and clears the target. No second meal occurs, so reserve stays 76 and biomass stays 4. No travel, growth or other eater affects either tick.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496c54"/></marker></defs>
<rect width="820" height="688" rx="14" fill="#f6f7f1"/>
<g font-family="system-ui, sans-serif" fill="#20382c">
<text x="28" y="39" font-size="25" font-weight="700">Choice reads the reserve before eating</text>
<text x="28" y="69" font-size="17">Future trace · same cell · upkeep 1 · bite limit 4 · capacity 100</text>
<text x="28" y="96" font-size="17">Start: Seeking, reserve 74, patch biomass 8. No growth or other eater.</text>

<rect x="28" y="122" width="764" height="215" rx="12" fill="#fff" stroke="#b9cbb8"/>
<text x="48" y="154" font-size="20" font-weight="700">First tick</text>
<text x="48" y="192" font-size="17" font-weight="650">1 · Upkeep</text>
<text x="48" y="226" font-size="23">74 → 73</text>
<path d="M178 218H214" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<text x="236" y="192" font-size="17" font-weight="650">2 · Choice reads 73</text>
<text x="236" y="225" font-size="18">Keep Seeking</text>
<text x="236" y="253" font-size="17">Keep a valid target</text>
<path d="M455 218H493" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<text x="515" y="192" font-size="17" font-weight="650">3 · Meal transfers 4</text>
<text x="515" y="225" font-size="23">73 → 77</text>
<text x="515" y="253" font-size="17">Biomass: 8 → 4</text>
<rect x="48" y="279" width="724" height="40" rx="7" fill="#e3eddf"/>
<text x="64" y="306" font-size="18" font-weight="650">Inspector: reserve 77 · Seeking · target present · biomass 4</text>

<path d="M410 343V369" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="379" width="764" height="215" rx="12" fill="#fff" stroke="#b9cbb8"/>
<text x="48" y="411" font-size="20" font-weight="700">Next tick</text>
<text x="48" y="449" font-size="17" font-weight="650">1 · Upkeep</text>
<text x="48" y="483" font-size="23">77 → 76</text>
<path d="M178 475H214" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<text x="236" y="449" font-size="17" font-weight="650">2 · Choice reads 76</text>
<text x="236" y="482" font-size="18">Switch to Idle</text>
<text x="236" y="510" font-size="17">Clear the target</text>
<path d="M455 475H493" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<text x="515" y="449" font-size="17" font-weight="650">3 · No target, no meal</text>
<text x="515" y="482" font-size="23">76 → 76</text>
<text x="515" y="510" font-size="17">Biomass stays 4</text>
<rect x="48" y="536" width="724" height="40" rx="7" fill="#e8eee9"/>
<text x="64" y="563" font-size="18" font-weight="650">Inspector: reserve 76 · Idle · no target · biomass 4</text>

<text x="28" y="630" font-size="17">Seeking stops at 75 or above when choice runs. The meal runs later.</text>
<text x="28" y="658" font-size="17">Movement changes nothing here: the hare is already on the patch.</text>
</g></svg>
