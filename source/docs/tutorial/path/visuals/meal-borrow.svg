<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
<title id="title">One meal changes the caller's same two values</title>
<desc id="desc">Before the call, Fern has reserve 98 of capacity 100 and Meadow has 5 biomass. During the call, the helper borrows both values mutably. Room 2, biomass 5 and bite limit 4 permit an actual transfer of 2. After the call, the caller's Fern has reserve 100 and Meadow has biomass 3. The function returns the copied number 2. These are snapshots over time, not newly created animals or patches.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496c54"/></marker></defs>
<rect width="820" height="470" rx="14" fill="#f6f7f1"/>
<g font-family="system-ui, sans-serif" fill="#20382c">
<text x="28" y="38" font-size="25" font-weight="700">One meal, the same two values</text>
<text x="28" y="67" font-size="17">Worked example · each row is a later moment in the same call</text>
<text x="28" y="118" font-size="18" font-weight="650">Before</text>
<rect x="155" y="89" width="285" height="65" rx="10" fill="#fff" stroke="#477d59"/>
<text x="175" y="115" font-size="18">Fern: Energy</text>
<text x="175" y="141" font-size="17">reserve 98 / capacity 100</text>
<rect x="470" y="89" width="305" height="65" rx="10" fill="#fff" stroke="#477d59"/>
<text x="490" y="115" font-size="18">Meadow: FoodPatch</text>
<text x="490" y="141" font-size="17">biomass 5</text>
<path d="M295 158V199" fill="none" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M623 158V199" fill="none" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<text x="312" y="181" font-size="17">&amp;mut</text>
<text x="639" y="181" font-size="17">&amp;mut</text>
<text x="28" y="237" font-size="18" font-weight="650">During</text>
<rect x="155" y="204" width="620" height="91" rx="10" fill="#e3eddf"/>
<text x="175" y="231" font-size="18">eat_from_patch borrows and changes these values</text>
<text x="175" y="257" font-size="17">room 2 · available food 5 · bite limit 4</text>
<text x="175" y="282" font-size="18" font-weight="650">smallest limit = 2 → add 2 to Fern, remove 2 from Meadow</text>
<path d="M295 299V337" fill="none" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M623 299V337" fill="none" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"/>
<text x="28" y="370" font-size="18" font-weight="650">After</text>
<rect x="155" y="342" width="285" height="65" rx="10" fill="#fff" stroke="#477d59"/>
<text x="175" y="368" font-size="18">Fern: Energy</text>
<text x="175" y="394" font-size="17">reserve 100 / capacity 100</text>
<rect x="470" y="342" width="305" height="65" rx="10" fill="#fff" stroke="#477d59"/>
<text x="490" y="368" font-size="18">Meadow: FoodPatch</text>
<text x="490" y="394" font-size="17">biomass 3</text>
<text x="28" y="446" font-size="17">The caller keeps both values. The return value, 2, reports the actual transfer.</text>
</g></svg>
