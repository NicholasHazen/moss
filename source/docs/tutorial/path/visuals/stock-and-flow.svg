<svg xmlns="http://www.w3.org/2000/svg" width="940" height="570" viewBox="0 0 940 570" role="img" aria-labelledby="title desc">
<title id="title">An empty patch can still supply food</title>
<desc id="desc">Expected consecutive ticks under the proposed daylight and feeding rules. A seeking hare is already on a patch with biomass zero and reserve twenty. During day tick119, growth raises biomass to one, upkeep reduces reserve to nineteen, and a one-unit meal leaves biomass zero and reserve twenty. During night tick120, no growth or meal occurs, leaving biomass zero and reserve nineteen. Same final patch stock does not mean the same production or consumption.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496c54"/></marker></defs>
<rect width="940" height="570" rx="14" fill="#f6f7f1"/>
<g font-family="system-ui, sans-serif" fill="#20382c">
<text x="30" y="40" font-size="26" font-weight="700">Same empty patch. Different activity.</text>
<text x="30" y="71" font-size="17">Expected trace · one seeking hare already on Meadow · no travel</text>
<text x="30" y="111" font-size="20" font-weight="700">Day · executing tick 119</text>
<g fill="#e3eddf" stroke="#b9cbb8">
<rect x="30" y="132" width="190" height="117" rx="10"/>
<rect x="260" y="132" width="190" height="117" rx="10"/>
<rect x="490" y="132" width="190" height="117" rx="10"/>
<rect x="720" y="132" width="190" height="117" rx="10"/>
</g>
<g font-size="18">
<text x="48" y="160" font-weight="700">Start</text><text x="48" y="194">Biomass 0</text><text x="48" y="226">Reserve 20</text>
<text x="278" y="160" font-weight="700">Grow 1</text><text x="278" y="194">Biomass 1</text><text x="278" y="226">Reserve 20</text>
<text x="508" y="160" font-weight="700">Spend 1</text><text x="508" y="194">Biomass 1</text><text x="508" y="226">Reserve 19</text>
<text x="738" y="160" font-weight="700">Eat 1 · end</text><text x="738" y="194">Biomass 0</text><text x="738" y="226">Reserve 20</text>
</g>
<g fill="none" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"><path d="M226 193H252"/><path d="M456 193H482"/><path d="M686 193H712"/></g>
<text x="30" y="294" font-size="20" font-weight="700">Night · executing tick 120</text>
<g fill="#e9edf4" stroke="#c3cbd8">
<rect x="30" y="315" width="190" height="117" rx="10"/>
<rect x="260" y="315" width="190" height="117" rx="10"/>
<rect x="490" y="315" width="190" height="117" rx="10"/>
<rect x="720" y="315" width="190" height="117" rx="10"/>
</g>
<g font-size="18">
<text x="48" y="343" font-weight="700">Start</text><text x="48" y="377">Biomass 0</text><text x="48" y="409">Reserve 20</text>
<text x="278" y="343" font-weight="700">Grow 0</text><text x="278" y="377">Biomass 0</text><text x="278" y="409">Reserve 20</text>
<text x="508" y="343" font-weight="700">Spend 1</text><text x="508" y="377">Biomass 0</text><text x="508" y="409">Reserve 19</text>
<text x="738" y="343" font-weight="700">Eat 0 · end</text><text x="738" y="377">Biomass 0</text><text x="738" y="409">Reserve 19</text>
</g>
<g fill="none" stroke="#496c54" stroke-width="2" marker-end="url(#arrow)"><path d="M226 376H252"/><path d="M456 376H482"/><path d="M686 376H712"/></g>
<text x="30" y="480" font-size="20" font-weight="700">Both ticks end at biomass 0, despite different growth and meals.</text>
<text x="30" y="516" font-size="17">Upkeep: 1 per tick · daylight growth: 1 per tick · bite limit: 4</text>
<text x="30" y="546" font-size="16">Empty-patch example; stored food remains edible at night. Proposed results, not live behavior.</text>
</g></svg>
