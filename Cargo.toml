[workspace]
members = ["crates/moss-sim", "crates/moss-web"]
default-members = ["crates/moss-sim"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.1.0"
publish = false

[workspace.dependencies]
bevy_ecs = { version = "=0.18.1", default-features = false, features = ["std"] }
bevy = { version = "=0.18.1", default-features = false, features = [
    "std", "async_executor", "bevy_asset", "bevy_log", "bevy_window",
    "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_sprite",
    "bevy_sprite_render", "webgl2",
] }
wasm-bindgen = "=0.2.123"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"

